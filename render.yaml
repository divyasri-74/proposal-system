# Render Blueprint — deploys the backend as a Docker web service.
# Dashboard: New + → Blueprint → select this repo.
services:
  - type: web
    name: proposal-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://proposal-gen.vercel.app
